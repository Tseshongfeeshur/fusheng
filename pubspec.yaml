name: fusheng
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  system_theme: ^3.2.0
  flex_color_scheme: ^8.4.0

  flutter_localizations:
    sdk: flutter
  slang: ^4.18.0
  slang_flutter: ^4.18.0
  provider: ^6.1.5+1

  flutter_speed_dial: ^7.0.0

  flutter_quill: ^11.5.1
  flutter_quill_extensions: ^11.0.0
  url_launcher: ^6.3.2
  quill_native_bridge: ^11.2.0
  flutter_keyboard_visibility_temp_fork: ^0.1.5

  timeline_tile: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
  - family: Misans
    fonts:
      - asset: assets/fonts/misans-vf.ttf
  - family: LxgwWenkai
    fonts:
      - asset: assets/fonts/lxgw-wenkai-screen.ttf
  - family: ZhuqueFangsong
    fonts:
      - asset: assets/fonts/zhuque-fangsong-regular.ttf
